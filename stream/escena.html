<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAT · Escena</title>
<link rel="stylesheet" href="assets/cat-stream.css">
<style>
  /* pantalla completa 1920×1080. ?modo=inicio | pausa | fin */
  body { width: 100vw; height: 100vh; background: var(--noche); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .capa { position: absolute; inset: 0; }
  .capa::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(to bottom, transparent 0 2px, rgba(0,0,0,.2) 2px 3px), radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); }
  .hud { inset: 3.4vh 2.2vw; --l: 4vh; --t: .35vh; }
  .texto { position: absolute; left: 0; right: 0; top: 7vh; display: grid; justify-items: center; gap: 1.6vh; text-align: center; }
  .kicker { font: 700 1.45vh/1 var(--mono); letter-spacing: .3em; padding: .8vh 1.2vh; }
  h1 { margin: 0; font: 900 8.4vh/.95 var(--display); letter-spacing: -.03em; color: var(--hueso); text-shadow: .5vh .5vh 0 var(--sombra), 0 0 3vh rgba(12,238,0,.45); }
  h1 span { color: var(--verde); }
  .sub { margin: 0; font: 500 2.4vh/1.3 var(--lectura); color: var(--liquen); }
  .reloj { font: 400 11vh/.8 var(--pantalla); color: var(--verde); text-shadow: 0 0 3vh rgba(12,238,0,.6); padding: 1vh 2.4vh .4vh; background: rgba(7,11,7,.85); border: .3vh solid var(--verde); }
  .reloj:empty { visibility: hidden; }
  .pie { position: absolute; left: 4.2vw; right: 4.2vw; bottom: 6.4vh; display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 2vw; }
  .pie .redes { justify-self: end; }
  .firma { font: 700 2.4vh/1 var(--display); color: var(--hueso); }
  .firma span { color: var(--verde); }
  .redes { font: 500 1.7vh/1.4 var(--mono); color: var(--liquen); text-align: right; letter-spacing: .04em; }
  .redes b { color: var(--verde); font-weight: 500; }
  .ticker { position: absolute; left: 0; right: 0; top: 0; height: 4.2vh; background: #040704; border-bottom: 2px solid var(--verde); overflow: hidden; display: flex; align-items: center; }
  .ticker div { white-space: nowrap; font: 500 1.6vh/1 var(--mono); letter-spacing: .25em; color: var(--verde); animation: corre 40s linear infinite; padding-left: 100%; }
  @keyframes corre { to { transform: translateX(-100%); } }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="capa">
  <div class="ticker"><div id="ticker"></div></div>
  <div class="hud"></div>
  <div class="texto">
    <span class="chip kicker" id="kicker"></span>
    <h1 id="titulo"></h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="pie">
    <div class="firma">A <span>CAT</span> Signature</div>
    <div class="reloj" id="reloj"></div>
    <div class="redes" id="redes"></div>
  </div>
</div>
<script src="assets/cat-stream.js"></script>
<script>
(function () {
  const $ = (s) => document.getElementById(s);
  const MODOS = {
    inicio: { kicker: 'Transmisión', titulo: 'Empezando <span>pronto</span>', sub: 'Buscá algo para tomar, ya arrancamos.' },
    pausa:  { kicker: 'Pausa', titulo: 'Vuelvo <span>enseguida</span>', sub: 'No te vayas: el gato vigila la señal.' },
    fin:    { kicker: 'Fin de la señal', titulo: 'Gracias <span>por ver</span>', sub: 'Nos vemos en el próximo stream.' }
  };
  const modo = MODOS[CAT.opt('modo', 'inicio')] || MODOS.inicio;
  $('kicker').textContent = CAT.opt('kicker', modo.kicker);
  // un título propio por URL: la última palabra va en verde
  const t = CAT.opt('titulo');
  $('titulo').innerHTML = t ? CAT.esc(t).replace(/(\S+)$/, '<span>$1</span>') : modo.titulo;
  $('sub').textContent = CAT.opt('sub', modo.sub);
  $('redes').innerHTML = CAT.opt('redes', 'YouTube @Esparragoh|github.com/EsparragoCAT').split('|').map((r) => `<b>▸</b> ${CAT.esc(r)}`).join('<br>');
  const tick = CAT.opt('ticker', 'SYS://CAT ▸ ONLINE ▸ CODE, ART & TECHNOLOGY ▸ A CAT SIGNATURE');
  $('ticker').textContent = (tick + '     ◆     ').repeat(4);

  // cuenta regresiva: ?min=5
  const min = +CAT.opt('min', 0);
  if (min > 0) {
    const end = Date.now() + min * 60000;
    const upd = () => {
      const s = Math.max(0, Math.round((end - Date.now()) / 1000));
      $('reloj').textContent = s ? `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}` : 'YA CASI…';
    };
    upd(); setInterval(upd, 500);
  }

  /* ---------- fondo: el gato como sol sobre la grilla que avanza ---------- */
  const cv = $('cv'), ctx = cv.getContext('2d');
  const mask = new Image(); mask.src = 'assets/cat-mask.png';
  let W, H, sun = null;
  function size() {
    const d = Math.min(2, window.devicePixelRatio || 1);
    W = cv.width = Math.round(innerWidth * d); H = cv.height = Math.round(innerHeight * d); sun = null;
  }
  function makeSun() {
    // logo teñido con franjas recortadas, como el sol vaporwave
    const lh = H * 0.34, lw = lh * mask.naturalWidth / mask.naturalHeight;
    const c = document.createElement('canvas'); c.width = Math.ceil(lw); c.height = Math.ceil(lh);
    const g = c.getContext('2d');
    g.drawImage(mask, 0, 0, lw, lh); g.globalCompositeOperation = 'source-in'; g.fillStyle = '#0CEE00'; g.fillRect(0, 0, lw, lh);
    g.globalCompositeOperation = 'destination-out';
    for (let i = 0; i < 6; i++) g.fillRect(0, lh * (0.6 + i * 0.07), lw, lh * (0.008 + i * 0.008));
    sun = c;
  }
  addEventListener('resize', size); size();
  const t0 = performance.now();
  function frame(now) {
    const t = (now - t0) / 1000, hy = H * 0.64, vx = W / 2;
    ctx.fillStyle = '#070b07'; ctx.fillRect(0, 0, W, H);
    let g = ctx.createRadialGradient(vx, hy, 0, vx, hy, W * 0.5);
    g.addColorStop(0, 'rgba(12,238,0,.34)'); g.addColorStop(.45, 'rgba(12,238,0,.07)'); g.addColorStop(1, 'rgba(12,238,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, hy);
    if (mask.naturalWidth) {
      if (!sun) makeSun();
      const bob = Math.sin(t * 0.6) * H * 0.006;
      ctx.save(); ctx.shadowColor = 'rgba(12,238,0,.6)'; ctx.shadowBlur = H * 0.04;
      ctx.drawImage(sun, vx - sun.width / 2, hy - sun.height * 0.9 + bob); ctx.restore();
    }
    ctx.fillStyle = '#070b07'; ctx.fillRect(0, hy, W, H - hy);
    g = ctx.createLinearGradient(0, hy, 0, H); g.addColorStop(0, 'rgba(12,238,0,.22)'); g.addColorStop(1, 'rgba(12,238,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, hy, W, H - hy);
    ctx.save(); ctx.beginPath(); ctx.rect(0, hy, W, H - hy); ctx.clip();
    ctx.strokeStyle = '#0CEE00'; ctx.lineWidth = Math.max(1.5, H / 700);
    const spread = W / 9;
    for (let i = -14; i <= 14; i++) {
      ctx.globalAlpha = 0.55 - Math.min(0.45, Math.abs(i) * 0.03);
      ctx.beginPath(); ctx.moveTo(vx + i * spread / 11, hy); ctx.lineTo(vx + i * spread, H + 10); ctx.stroke();
    }
    // líneas horizontales que vienen hacia la cámara
    const off = (t * 0.35) % 1;
    ctx.fillStyle = '#0CEE00';
    for (let k = 0; k < 12; k++) {
      const p = (k + off) / 12, y = hy + (H - hy) * Math.pow(p, 2.2);
      ctx.globalAlpha = 0.1 + p * 0.7; ctx.fillRect(0, y, W, Math.max(1.5, H / 700));
    }
    ctx.restore(); ctx.globalAlpha = 1;
    ctx.save(); ctx.shadowColor = 'rgba(12,238,0,.8)'; ctx.shadowBlur = H * 0.02; ctx.fillStyle = '#0CEE00'; ctx.fillRect(0, hy - 1, W, Math.max(2, H / 400)); ctx.restore();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
