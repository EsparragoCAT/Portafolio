<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAT · Alertas</title>
<link rel="stylesheet" href="assets/cat-stream.css">
<style>
  /* lienzo pensado para 1920×1080; la alerta va arriba al centro */
  body { width: 100vw; height: 100vh; }
  .alerta { position: absolute; left: 50%; top: 6vh; width: min(760px, 92vw); transform: translateX(-50%); opacity: 0; pointer-events: none; }
  .al-caja { position: relative; display: grid; grid-template-columns: 132px 1fr; align-items: center; gap: 26px; padding: 26px 34px 30px 30px;
    background: radial-gradient(ellipse 70% 120% at 12% 50%, rgba(12,238,0,.2), transparent 70%), rgba(7, 11, 7, .94);
    border: 2px solid var(--verde); box-shadow: 0 0 0 6px rgba(7,11,7,.6), 0 0 48px rgba(12,238,0,.35); overflow: hidden; }
  .al-caja .hud { inset: 10px; --l: 22px; }
  .al-icono { position: relative; width: 132px; height: 132px; display: grid; place-items: center; }
  .al-icono .cat { width: 112px; filter: drop-shadow(0 0 16px rgba(12,238,0,.7)); }
  .al-icono b { position: absolute; right: -4px; bottom: -2px; font: 400 44px/1 var(--pantalla); color: var(--noche); background: var(--verde); padding: 2px 8px 0; }
  .al-txt { min-width: 0; display: grid; gap: 8px; }
  .al-tipo { margin: 0; justify-self: start; }
  .al-nombre { margin: 0; font: 900 52px/1.02 var(--display); letter-spacing: -.02em; color: var(--hueso); text-shadow: 4px 4px 0 var(--sombra), var(--glow); overflow-wrap: anywhere; }
  .al-msg { margin: 0; font: 500 22px/1.3 var(--lectura); color: var(--liquen); overflow-wrap: anywhere; }
  .al-msg:empty { display: none; }
  .al-barra { position: absolute; left: 0; bottom: 0; height: 5px; width: 100%; background: var(--verde); transform-origin: left; box-shadow: var(--glow); }

  .alerta.on { animation: al-on .55s cubic-bezier(.2,.7,.2,1) both; }
  .alerta.on .al-barra { animation: al-tiempo var(--dur, 7s) linear both; }
  .alerta.on .al-nombre { animation: al-glitch .5s steps(2) .35s both; }
  .alerta.off { animation: al-off .45s cubic-bezier(.6,0,.8,.4) both; }
  @keyframes al-on { 0% { opacity: 1; transform: translateX(-50%) scale(0, .02); filter: brightness(3); } 45% { opacity: 1; transform: translateX(-50%) scale(1, .02); filter: brightness(3); } 100% { opacity: 1; transform: translateX(-50%) scale(1, 1); filter: none; } }
  @keyframes al-off { 0% { opacity: 1; transform: translateX(-50%) scale(1, 1); } 55% { opacity: 1; transform: translateX(-50%) scale(1, .02); filter: brightness(3); } 100% { opacity: 0; transform: translateX(-50%) scale(0, .02); } }
  @keyframes al-tiempo { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  @keyframes al-glitch { 0% { transform: translateX(-8px); text-shadow: -6px 0 rgba(12,238,0,.8), 4px 4px 0 var(--sombra); } 50% { transform: translateX(5px); } 100% { transform: none; } }
</style>
</head>
<body>
<div class="alerta" id="alerta" aria-live="polite">
  <div class="al-caja scan">
    <div class="hud"></div>
    <div class="al-icono"><span class="cat"></span><b id="al-num" hidden></b></div>
    <div class="al-txt">
      <span class="chip al-tipo" id="al-tipo"></span>
      <p class="al-nombre" id="al-nombre"></p>
      <p class="al-msg" id="al-msg"></p>
    </div>
    <i class="al-barra"></i>
  </div>
</div>
<script src="assets/cat-stream.js"></script>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const box = $('#alerta');
  const baseDur = +CAT.opt('duracion', 7);
  const showMsg = CAT.opt('mensajes', '1') !== '0';

  // texto y sonido de cada tipo
  const KIND = {
    follow:   (e) => ({ tipo: 'Nuevo seguidor', nombre: e.name, msg: 'Bienvenido a la señal', sound: [[660, 0, .12], [990, .1, .25]] }),
    sub:      (e) => ({ tipo: e.months > 1 ? `Sub · ${e.months} meses` : 'Nuevo sub', nombre: e.name, msg: e.text || e.tier, num: e.months > 1 ? e.months : '', sound: [[523, 0, .12], [659, .1, .12], [784, .2, .12], [1047, .3, .4]] }),
    gift:     (e) => ({ tipo: 'Sub de regalo', nombre: e.name, msg: `le regaló un sub a ${e.to}`, sound: [[784, 0, .1], [988, .09, .1], [1175, .18, .35]] }),
    giftbomb: (e) => ({ tipo: 'Lluvia de subs', nombre: e.name, msg: `regaló ${e.count} subs al chat`, num: '×' + e.count, sound: [[523, 0, .08], [659, .07, .08], [784, .14, .08], [1047, .21, .08], [1319, .28, .45]] }),
    bits:     (e) => ({ tipo: `${e.amount} bits`, nombre: e.name, msg: e.text, num: e.amount, sound: [[1200, 0, .06], [1600, .06, .06], [2000, .12, .3]] }),
    raid:     (e) => ({ tipo: 'Raid', nombre: e.name, msg: `llega con ${e.viewers} ${e.viewers === 1 ? 'persona' : 'personas'}`, num: e.viewers, sound: [[220, 0, .25], [330, .2, .25], [440, .4, .25], [880, .6, .6]] })
  };
  // ?tipos=sub,bits,raid  para elegir cuáles se muestran
  const allowed = new Set(CAT.opt('tipos', 'follow,sub,gift,giftbomb,bits,raid').split(','));

  const queue = [];
  let busy = false;
  CAT.on('alert', (e) => {
    if (!allowed.has(e.type) || !KIND[e.type]) return;
    if (e.type === 'bits' && e.amount < +CAT.opt('minbits', 1)) return;
    queue.push(e); next();
  });

  function next() {
    if (busy || !queue.length) return;
    busy = true;
    const e = queue.shift(), k = KIND[e.type](e);
    const dur = baseDur + (showMsg && k.msg && k.msg.length > 40 ? 2 : 0);
    $('#al-tipo').textContent = k.tipo;
    $('#al-nombre').textContent = k.nombre;
    $('#al-msg').textContent = showMsg ? (k.msg || '') : '';
    const num = $('#al-num'); num.hidden = !k.num; num.textContent = k.num || '';
    box.style.setProperty('--dur', dur + 's');
    box.className = 'alerta'; void box.offsetWidth; box.className = 'alerta on';
    // blip de terminal al prenderse la caja y, encima, el sonido del tipo (si no carga, suena el sintetizado)
    CAT.play('encender', 0.45);
    setTimeout(() => CAT.play(e.type, 1, k.sound), 140);
    setTimeout(() => {
      box.className = 'alerta off';
      setTimeout(() => { busy = false; next(); }, 700);
    }, dur * 1000);
  }

  CAT.preload(['encender', 'follow', 'sub', 'gift', 'giftbomb', 'bits', 'raid']);
  CAT.start({ chat: true });
})();
</script>
</body>
</html>
